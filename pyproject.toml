[project]
name = "razorpay-assay"
version = "0.1.0"
description = "Evidence-first merchant-risk signal verification backend"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "polars>=1.30,<2",
  "pyarrow>=20,<30",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.13,<4",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "uvicorn>=0.35,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
gpu = [
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.uv]
package = false

name: branch-guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate-change-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch, pull request, and commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^(feat|fix|chore|refactor|docs|exp)/[a-z0-9]+(-[a-z0-9]+)*$'
          conventional_pattern='^(feat|fix|chore|refactor|docs|test|build|ci|perf|revert)(\([a-z0-9-]+\))?!?: .+'
          prohibited_pattern='(claude|codex|cursor|copilot|co-authored-by.*(bot|agent)|generated with)'

          if [[ ! "$PR_BRANCH" =~ $branch_pattern ]]; then
            echo "Invalid branch name: $PR_BRANCH"
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ $conventional_pattern ]]; then
            echo "Pull request title must use Conventional Commits format."
            exit 1
          fi

          metadata=$(printf '%s\n%s\n%s' "$PR_BRANCH" "$PR_TITLE" "${PR_BODY:-}" | tr '[:upper:]' '[:lower:]')
          if grep -Eiq "$prohibited_pattern" <<<"$metadata"; then
            echo "Pull request metadata contains prohibited coding-tool attribution."
            exit 1
          fi

          while IFS= read -r commit_subject; do
            if [[ ! "$commit_subject" =~ $conventional_pattern ]]; then
              echo "Invalid commit message: $commit_subject"
              exit 1
            fi
          done < <(git log --format='%s' "$BASE_SHA..$HEAD_SHA")

          if git log --format='%s%n%b' "$BASE_SHA..$HEAD_SHA" | grep -Eiq "$prohibited_pattern"; then
            echo "Commit message contains prohibited coding-tool attribution."
            exit 1
          fi

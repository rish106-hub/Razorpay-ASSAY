name: backend-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        run: |
          python -m pip install uv==0.11.30
          uv sync --locked

      - name: Lint backend and data pipeline
        run: uv run python -m ruff check .

      - name: Run backend and data pipeline tests
        run: uv run python -m pytest

      - name: Validate source provenance manifests
        run: uv run python -m scripts.validate_manifests

sources:
  - id: mca_company_master
    priority: P0
    publisher: Ministry of Corporate Affairs, Government of India
    purpose: core_entity_context
    canonical_url: https://www.data.gov.in/resource/registrars-companies-roc-wise-company-master-data
    licence: Government Open Data License - India / source-specific terms
    declared_data_through: '2023-11-03'
    access: public_portal_state_or_roc_downloads
    required_fields:
      - CORPORATE_IDENTIFICATION_NUMBER
      - DATE_OF_REGISTRATION
      - COMPANY_NAME
      - COMPANY_STATUS
      - REGISTERED_OFFICE_ADDRESS
    target_fields: []
    constraints:
      - company_status_is_not_fraud_label
      - preserve_raw_downloads
      - record_per_file_coverage_and_schema

  - id: nse_sebi_debarred
    priority: P0
    publisher: National Stock Exchange of India Limited
    purpose: external_adverse_outcome_validation
    canonical_url: https://www.nseindia.com/static/regulations/member-sebi-debarred-entities
    licence: NSE_website_terms_source_specific_no_redistribution_grant
    terms_url: https://www.nseindia.com/static/nse-terms-of-use
    data_policy_url: https://www.nseindia.com/static/market-data/nse-data-policy
    access: public_xls_download
    target_fields:
      - adverse_regulatory_outcome
    constraints:
      - debarment_is_not_synonymous_with_fraud
      - require_match_quality_audit
      - use_cin_before_name_matching

  - id: nse_other_authorities_debarred
    priority: P0
    publisher: National Stock Exchange of India Limited
    purpose: external_other_authority_outcome_validation
    canonical_url: https://nsearchives.nseindia.com/content/press/prs_ra_others.xls
    licence: NSE_website_terms_source_specific_no_redistribution_grant
    terms_url: https://www.nseindia.com/static/nse-terms-of-use
    data_policy_url: https://www.nseindia.com/static/market-data/nse-data-policy
    access: public_xls_download
    target_fields:
      - adverse_regulatory_outcome
    constraints:
      - other_authority_action_is_not_synonymous_with_fraud
      - require_match_quality_audit
      - use_cin_before_name_matching

  - id: fraud_detection_handbook
    priority: P2
    publisher: Fraud Detection Handbook project
    purpose: controlled_verifier_benchmark
    canonical_url: https://fraud-detection-handbook.github.io/fraud-detection-handbook/Chapter_3_GettingStarted/SimulatedDataset.html
    licence: GPLv3_for_code_and_CC_BY_SA_4_0_for_documentation
    access: public_generator
    constraints:
      - fixed_seed_required
      - never_mix_with_mca_labels
      - does_not_block_milestone_one

  - id: ibbi_cirp_public_announcements
    priority: P0
    publisher: Insolvency and Bankruptcy Board of India
    purpose: merchant_solvency_outcome_validation
    canonical_url: https://ibbi.gov.in/public-announcement
    licence: unknown_IBBI_website_reuse_terms
    access: public_filtered_tsv_export
    target_fields:
      - cirp_public_announcement_outcome
    constraints:
      - insolvency_is_not_synonymous_with_fraud
      - announcement_date_is_not_cirp_commencement_date
      - use_valid_cin_only_for_automatic_linkage
      - quarantine_malformed_publisher_rows
      - no_raw_redistribution_until_terms_are_cleared

  - id: gleif_golden_copy
    priority: P1
    publisher: Global Legal Entity Identifier Foundation
    purpose: conditional_identity_and_ownership_enrichment
    canonical_url: https://www.gleif.org/en/lei-data/gleif-golden-copy/download-the-golden-copy
    licence: CC0
    access: public_download
    constraints:
      - require_india_coverage_gate
      - require_usable_relationship_edge_count

  - id: opensanctions_nse_debarred
    priority: P2
    publisher: OpenSanctions
    purpose: normalized_student_prototype_convenience
    canonical_url: https://www.opensanctions.org/datasets/in_nse_debarred/
    licence: CC_BY_NC_4_0
    access: public_download
    constraints:
      - noncommercial_only_without_paid_licence
      - use_cin_before_name_matching
      - require_match_quality_audit
      - cannot_substitute_for_official_nse_provenance

  - id: ieee_cis_fraud_detection
    priority: deferred
    publisher: IEEE Computational Intelligence Society via Kaggle
    purpose: unrelated_transaction_benchmark
    canonical_url: https://www.kaggle.com/competitions/ieee-fraud-detection/data
    licence: Kaggle_competition_terms
    access: Kaggle_account_required
    constraints:
      - do_not_make_critical_path
